services:
  strava-app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/app
      - strava-node-modules:/usr/src/app/node_modules
    env_file:
      - .env.local
    # environment:
    #   - CLIENT_ID=your_strava_client_id
    #   - CLIENT_SECRET=your_strava_client_secret

volumes:
  strava-node-modules:
